<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Realtime chat</title>
    <style>
        :root {
            --bg: #f3f4f6;
            --surface: #ffffff;
            --border: #e5e7eb;
            --text: #111827;
            --muted: #6b7280;
            --accent: #4f46e5;
            --accent-text: #ffffff;
            --own-bg: var(--accent);
            --own-text: #ffffff;
            --other-bg: #eef0f4;
            --danger: #dc2626;
            --ok: #16a34a;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0b0d12;
                --surface: #14171f;
                --border: #262b36;
                --text: #e5e7eb;
                --muted: #9aa3b2;
                --accent: #6366f1;
                --other-bg: #1e2330;
                --danger: #f87171;
                --ok: #4ade80;
            }
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; margin: 0; }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
        }

        .chat {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 720px;
            height: 100dvh;
            background: var(--surface);
        }

        /* Desktop: floating card instead of full-bleed */
        @media (min-width: 768px) {
            body { align-items: center; }
            .chat {
                height: min(860px, calc(100dvh - 3rem));
                border: 1px solid var(--border);
                border-radius: 16px;
                box-shadow: 0 10px 40px rgb(0 0 0 / 0.08);
                overflow: hidden;
            }
        }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.875rem 1rem;
            padding-top: max(0.875rem, env(safe-area-inset-top));
            border-bottom: 1px solid var(--border);
        }

        .chat-header h1 { margin: 0; font-size: 1.05rem; font-weight: 650; }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            color: var(--muted);
        }

        .status::before {
            content: "";
            width: 0.55rem;
            height: 0.55rem;
            border-radius: 50%;
            background: var(--muted);
        }

        .status[data-state="online"]::before { background: var(--ok); }
        .status[data-state="offline"]::before { background: var(--danger); }

        #messages {
            flex: 1;
            list-style: none;
            margin: 0;
            padding: 1rem;
            overflow-y: auto;
            overscroll-behavior: contain;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .empty {
            margin: auto;
            color: var(--muted);
            font-size: 0.9rem;
        }

        #messages li:not(.empty) { max-width: 85%; overflow-wrap: anywhere; }

        .msg {
            padding: 0.5rem 0.75rem;
            border-radius: 14px;
            background: var(--other-bg);
            line-height: 1.35;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .msg.own {
            align-self: flex-end;
            background: var(--own-bg);
            color: var(--own-text);
            border-bottom-left-radius: 14px;
            border-bottom-right-radius: 4px;
        }

        .msg .author {
            display: block;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 0.1rem;
        }

        .system {
            align-self: center;
            font-size: 0.78rem;
            color: var(--muted);
            text-align: center;
        }

        .system.error { color: var(--danger); }

        .composer {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
            border-top: 1px solid var(--border);
        }

        #message-input {
            flex: 1;
            min-width: 0;
            font: inherit;
            /* 16px+ prevents iOS Safari from zooming on focus */
            font-size: 1rem;
            padding: 0.65rem 0.9rem;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--bg);
            color: var(--text);
        }

        #message-input:focus-visible,
        #send-button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        #char-counter {
            font-size: 0.75rem;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        #char-counter.limit { color: var(--danger); }

        /* Counter is noise on small screens until you are close to the limit */
        @media (max-width: 480px) {
            #char-counter:not(.limit) { display: none; }
        }

        #send-button {
            font: inherit;
            font-weight: 600;
            padding: 0.65rem 1.1rem;
            border: 0;
            border-radius: 999px;
            background: var(--accent);
            color: var(--accent-text);
            cursor: pointer;
        }

        #send-button:disabled { opacity: 0.5; cursor: not-allowed; }

        .header-right { display: flex; align-items: center; gap: 0.75rem; min-width: 0; }

        #current-user {
            font-size: 0.8rem;
            color: var(--muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .link-button {
            font: inherit;
            font-size: 0.8rem;
            padding: 0;
            border: 0;
            background: none;
            color: var(--accent);
            cursor: pointer;
        }

        .auth {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            max-width: 360px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
        }

        .auth h2 { margin: 0 0 0.25rem; font-size: 1.25rem; }

        .auth input {
            font: inherit;
            font-size: 1rem;
            padding: 0.65rem 0.9rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg);
            color: var(--text);
        }

        .auth-actions { display: flex; gap: 0.5rem; }

        .auth-actions button {
            flex: 1;
            font: inherit;
            font-weight: 600;
            padding: 0.65rem 1rem;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid var(--accent);
        }

        #login-button { background: var(--accent); color: var(--accent-text); }
        #register-button { background: transparent; color: var(--accent); }
        .auth-actions button:disabled { opacity: 0.5; cursor: not-allowed; }

        #auth-error, #lobby-error { min-height: 1.2em; margin: 0; font-size: 0.85rem; color: var(--danger); }

        .auth-actions .primary { background: var(--accent); color: var(--accent-text); }
        .auth-actions .secondary { background: transparent; color: var(--accent); }

        .auth .hint { margin: 0; font-size: 0.85rem; color: var(--muted); }

        .room-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.6rem 1rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
        }

        .room-info { display: flex; flex-direction: column; min-width: 0; }
        #room-name { font-weight: 650; overflow-wrap: anywhere; }

        #room-members {
            color: var(--muted);
            font-size: 0.78rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <main class="chat">
        <header class="chat-header">
            <h1>Realtime chat</h1>
            <div class="header-right">
                <span id="current-user"></span>
                <button id="logout-button" class="link-button" hidden>Вийти</button>
                <span id="status" class="status" data-state="offline">Офлайн</span>
            </div>
        </header>

        <form id="auth-form" class="auth" hidden>
            <h2>Вхід у чат</h2>
            <input id="auth-email" type="email" placeholder="Email" autocomplete="email" required>
            <input id="auth-password" type="password" placeholder="Пароль (мін. 6 символів)" autocomplete="current-password" minlength="6" required>
            <div class="auth-actions">
                <button id="login-button" type="submit">Увійти</button>
                <button id="register-button" type="button">Зареєструватися</button>
            </div>
            <p id="auth-error" role="alert"></p>
        </form>

        <form id="lobby-form" class="auth" hidden>
            <h2>Лобі</h2>
            <p class="hint">Створи нову кімнату або зайди в існуючу за її назвою.</p>
            <input id="room-input" type="text" placeholder="Назва кімнати" autocomplete="off" maxlength="32" required>
            <div class="auth-actions">
                <button id="create-room-button" class="primary" type="submit">Створити</button>
                <button id="join-room-button" class="secondary" type="button">Зайти</button>
            </div>
            <p id="lobby-error" role="alert"></p>
        </form>

        <div id="room-bar" class="room-bar" hidden>
            <div class="room-info">
                <span id="room-name"></span>
                <span id="room-members"></span>
            </div>
            <button id="leave-room-button" class="link-button">Вийти з кімнати</button>
        </div>

        <ul id="messages" aria-live="polite" hidden>
            <li class="empty">Повідомлень поки немає</li>
        </ul>

        <div id="composer" class="composer" hidden>
            <input id="message-input" type="text" placeholder="Повідомлення" autocomplete="off" enterkeyhint="send">
            <span id="char-counter"></span>
            <button id="send-button" disabled>Надіслати</button>
        </div>
    </main>

    <script>
        const messagesList = document.querySelector('#messages');
        const messageInput = document.querySelector('#message-input');
        const sendButton = document.querySelector('#send-button');
        const charCounter = document.querySelector('#char-counter');
        const statusEl = document.querySelector('#status');

        // Must match the server-side text limit (step 8.3)
        const MAX_MESSAGE_LENGTH = 500;
        messageInput.maxLength = MAX_MESSAGE_LENGTH;

        function updateCharCounter() {
            const length = messageInput.value.length;
            charCounter.textContent = `${length}/${MAX_MESSAGE_LENGTH}`;
            charCounter.classList.toggle('limit', length >= MAX_MESSAGE_LENGTH);
        }
        updateCharCounter();

        function setStatus(state, label) {
            statusEl.dataset.state = state;
            statusEl.textContent = label;
            sendButton.disabled = state !== 'online';
        }

        // Adds one item to the list and keeps the view pinned to the newest message
        // unless the user has scrolled up to read history
        function appendItem(item) {
            messagesList.querySelector('.empty')?.remove();
            const nearBottom =
                messagesList.scrollHeight - messagesList.scrollTop - messagesList.clientHeight < 80;
            messagesList.append(item);
            if (nearBottom) messagesList.scrollTop = messagesList.scrollHeight;
        }

        // kind: 'own' | 'other' | 'system' | 'error'
        function addMessage(text, { kind = 'system', author = null } = {}) {
            const item = document.createElement('li');
            item.textContent = text;

            if (kind === 'system' || kind === 'error') {
                item.className = kind === 'error' ? 'system error' : 'system';
            } else {
                item.className = kind === 'own' ? 'msg own' : 'msg';
                if (author) {
                    const authorEl = document.createElement('span');
                    authorEl.className = 'author';
                    authorEl.textContent = author;
                    item.prepend(authorEl);
                }
            }
            appendItem(item);
        }

        const authForm = document.querySelector('#auth-form');
        const authEmail = document.querySelector('#auth-email');
        const authPassword = document.querySelector('#auth-password');
        const loginButton = document.querySelector('#login-button');
        const registerButton = document.querySelector('#register-button');
        const authError = document.querySelector('#auth-error');
        const logoutButton = document.querySelector('#logout-button');
        const currentUser = document.querySelector('#current-user');
        const composer = document.querySelector('#composer');

        const TOKEN_KEY = 'authToken';

        // localStorage can throw (private mode, blocked site data), so every access is guarded
        function loadToken() { try { return localStorage.getItem(TOKEN_KEY); } catch { return null; } }
        function saveToken(token) { try { localStorage.setItem(TOKEN_KEY, token); } catch {} }
        function clearToken() { try { localStorage.removeItem(TOKEN_KEY); } catch {} }

        // Reads the email from the JWT payload for display only — the server never trusts this
        function userIdFromToken(token) {
          try {
            const payload = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
            return JSON.parse(atob(payload)).id ?? null;
          } catch {
            return null;
          }
        }

        function emailFromToken(token) {
          try {
            const payload = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
            return JSON.parse(atob(payload)).email ?? '';
          } catch {
            return '';
          }
        }

        let socket = null;

        function resetMessages() {
          const empty = document.createElement('li');
          empty.className = 'empty';
          empty.textContent = 'Повідомлень поки немає';
          messagesList.replaceChildren(empty);
        }

        const lobbyForm = document.querySelector('#lobby-form');
        const roomInput = document.querySelector('#room-input');
        const createRoomButton = document.querySelector('#create-room-button');
        const joinRoomButton = document.querySelector('#join-room-button');
        const lobbyError = document.querySelector('#lobby-error');
        const roomBar = document.querySelector('#room-bar');
        const roomNameEl = document.querySelector('#room-name');
        const roomMembersEl = document.querySelector('#room-members');
        const leaveRoomButton = document.querySelector('#leave-room-button');

        // Which screen is visible: 'auth' | 'waiting' | 'lobby' | 'room'.
        // 'waiting' = connected, but the server hasn't told us yet whether we're in a room.
        function setScreen(screen) {
          authForm.hidden = screen !== 'auth';
          lobbyForm.hidden = screen !== 'lobby';
          roomBar.hidden = screen !== 'room';
          messagesList.hidden = screen !== 'room';
          composer.hidden = screen !== 'room';
          logoutButton.hidden = screen === 'auth';
        }

        let myUserId = null;
        let members = new Set();

        function renderMembers() {
          const labels = [...members].map((id) => (id === myUserId ? `${id} (ви)` : `${id}`));
          roomMembersEl.textContent = `Учасники (${members.size}): ${labels.join(', ')}`;
        }

        function setLobbyPending(pending) {
          createRoomButton.disabled = joinRoomButton.disabled = pending;
        }

        function showAuth(message = '') {
          setScreen('auth');
          currentUser.textContent = '';
          authError.textContent = message;
          setStatus('offline', 'Офлайн');
          authEmail.focus();
        }

        function showLobby() {
          setScreen('lobby');
          setLobbyPending(false);
          lobbyError.textContent = '';
          roomInput.focus();
        }

        // Snapshot from the server: we are in `room`, these are everyone in it (including us)
        function showRoom(room, memberIds) {
          setScreen('room');
          members = new Set(memberIds);
          roomNameEl.textContent = `# ${room}`;
          renderMembers();
          resetMessages();
          addMessage(`Ви в кімнаті «${room}»`);
          messageInput.focus();
        }

        function startSession(token) {
          setScreen('waiting');
          currentUser.textContent = emailFromToken(token);
          myUserId = userIdFromToken(token);
          connect(token);
        }

        // Lobby actions: the screen changes only when the server answers (room_joined or error)
        function requestRoom(type) {
          if (!lobbyForm.reportValidity()) return;
          if (socket?.readyState !== WebSocket.OPEN) return;

          lobbyError.textContent = '';
          setLobbyPending(true);
          socket.send(JSON.stringify({ type, room: roomInput.value.trim() }));
        }

        lobbyForm.addEventListener('submit', (event) => {
          event.preventDefault();
          requestRoom('create_room');
        });
        joinRoomButton.addEventListener('click', () => requestRoom('join_room'));

        // Leaving is confirmed by the server with a `lobby` message
        leaveRoomButton.addEventListener('click', () => {
          if (socket?.readyState !== WebSocket.OPEN) return;
          socket.send(JSON.stringify({ type: 'leave_room' }));
        });

        const ErrorText = {
          room_exists: 'Кімната з такою назвою вже існує',
          room_not_found: 'Кімнати з такою назвою немає',
        };

        // mode: 'login' | 'register' — both endpoints take {email, password} and return {token}
        async function authenticate(mode) {
          if (!authForm.reportValidity()) return;

          loginButton.disabled = registerButton.disabled = true;
          authError.textContent = '';

          try {
            const response = await fetch(`/auth/${mode}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: authEmail.value, password: authPassword.value }),
            });
            const body = await response.json().catch(() => ({}));

            if (!response.ok || !body.token) {
              authError.textContent = body.error ?? `Помилка ${response.status}`;
              return;
            }

            saveToken(body.token);
            authPassword.value = '';
            resetMessages();
            startSession(body.token);
          } catch {
            authError.textContent = 'Сервер недоступний';
          } finally {
            loginButton.disabled = registerButton.disabled = false;
          }
        }

        authForm.addEventListener('submit', (event) => {
          event.preventDefault();
          authenticate('login');
        });
        registerButton.addEventListener('click', () => authenticate('register'));

        logoutButton.addEventListener('click', () => {
          clearToken();
          const oldSocket = socket;
          socket = null; // so its close event is ignored below
          oldSocket?.close(1000, 'Logout');
          myUserId = null;
          members = new Set();
          resetMessages();
          showAuth();
        });

        function sendMessage() {
          const text = messageInput.value.trim();
          if (text === '' || socket?.readyState !== WebSocket.OPEN) return;

          addMessage(text, { kind: 'own' });
          socket.send(JSON.stringify({ type: 'chat', text }));
          messageInput.value = '';
          updateCharCounter();
        }

        sendButton.addEventListener('click', sendMessage);

        messageInput.addEventListener('keydown', (event) => {
          // isComposing: don't send while an IME is still composing a character
          if (event.key === 'Enter' && !event.isComposing) sendMessage();
        });

        messageInput.addEventListener('input', updateCharCounter);

        // Applies a server message: screen changes (lobby / room_joined / error) and room events
        function renderServerMessage(msg) {
          switch (msg.type) {
            case 'lobby':
              showLobby();
              break;
            case 'room_joined':
              showRoom(msg.room, msg.members);
              break;
            case 'error':
              setLobbyPending(false);
              lobbyError.textContent = ErrorText[msg.code] ?? `Помилка: ${msg.code}`;
              break;
            case 'chat':
              addMessage(msg.text, { kind: 'other', author: `Користувач ${msg.userId}` });
              break;
            case 'join':
              members.add(msg.userId);
              renderMembers();
              addMessage(`Користувач ${msg.userId} зайшов`);
              break;
            case 'leave':
              members.delete(msg.userId);
              renderMembers();
              addMessage(`Користувач ${msg.userId} вийшов`);
              break;
            default:
              console.warn('Unknown message type', msg);
          }
        }

        // Must match the server's close codes (4000–4999 is the range reserved for applications)
        const CloseCode = {
          MESSAGE_TOO_BIG: 1009,
          RATE_LIMIT_EXCEEDED: 4001,
          INVALID_MESSAGE: 4002,
          UNAUTHORIZED: 4003,
          SESSION_REPLACED: 4004,
        };

        // Human-readable text for WebSocket close codes the server may send
        function describeClose(code) {
          switch (code) {
            case CloseCode.MESSAGE_TOO_BIG:
              return 'Сервер відключив вас: повідомлення завелике';
            case CloseCode.RATE_LIMIT_EXCEEDED:
              return 'Сервер відключив вас: забагато повідомлень, пишіть повільніше';
            case CloseCode.INVALID_MESSAGE:
              return 'Сервер відключив вас: некоректне повідомлення';
            case CloseCode.SESSION_REPLACED:
              return 'Чат відкрито в іншій вкладці';
            default:
              return 'Зʼєднання з сервером втрачено';
          }
        }

        function connect(token) {
          // Same host the page was loaded from (works on localhost and from a phone).
          // Browsers can't set headers on the WebSocket handshake, so the token travels in the URL.
          const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
          const ws = new WebSocket(`${protocol}://${location.host}/?token=${encodeURIComponent(token)}`);
          socket = ws;
          setStatus('connecting', 'Підключення…');

          ws.addEventListener('open', () => setStatus('online', 'Онлайн'));

          ws.addEventListener('message', (event) => renderServerMessage(JSON.parse(event.data)));

          ws.addEventListener('close', (event) => {
            if (ws !== socket) return; // a socket we already replaced or closed on purpose (logout)

            console.log('Disconnected', event.code, event.reason);
            socket = null;

            if (event.code === CloseCode.UNAUTHORIZED) {
              clearToken();
              showAuth('Сесія недійсна або закінчилась, увійдіть знову');
              return;
            }

            setStatus('offline', 'Офлайн');
            setLobbyPending(true); // nothing to send to while offline

            // Show the reason on whichever screen is visible
            if (!lobbyForm.hidden) {
              lobbyError.textContent = describeClose(event.code);
            } else {
              setScreen('room');
              addMessage(describeClose(event.code), { kind: 'error' });
            }
          });
        }

        const savedToken = loadToken();
        if (savedToken) startSession(savedToken);
        else showAuth();
    </script>
</body>
</html>
